name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Build
        shell: pwsh
        run: pwsh scripts/package.ps1 -Version $env:GITHUB_REF_NAME

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME "out/$env:ASSET.zip" "out/$env:ASSET.zip.sha256" `
            --title "Mubsir $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md --prerelease --verify-tag
