name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  core:
    name: Core build and add-on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false


      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Core build (locked restore)
        run: dotnet build src/Mubsir.Core -c Release

      - name: Core tests
        run: dotnet test tests/Mubsir.Core.Tests -c Release

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Build the NVDA add-on
        run: python3 scripts/build-addon.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mubsirBridge-nvda-addon
          path: dist/*.nvda-addon
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build
    needs: core
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Restore (locked)
        run: dotnet restore src/Mubsir.App

      - name: Build
        run: dotnet build src/Mubsir.App -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish src/Mubsir.App -c Release -r win-x64 --no-restore -o publish

      - name: Build the NVDA add-on
        run: python scripts/build-addon.py --out-dir publish

      - name: Overlay smoke test
        shell: pwsh
        run: ./scripts/overlay-smoke.ps1 -Exe publish/Mubsir.exe -Out overlay-shots -ForceAnimations

      - name: Setup window pictures
        shell: pwsh
        run: ./scripts/setup-shots.ps1 -Exe publish/Mubsir.exe -Out overlay-shots

      - name: Build the Store package
        shell: pwsh
        run: ./scripts/pack-msix.ps1 -Publish publish -Out msix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mubsir-msix
          path: msix/*.msix
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: overlay-shots
          path: overlay-shots/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mubsir-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14

  books:
    name: Real book check
    needs: core
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Add Arabic OCR and speech
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name 'Language.OCR~~~ar-SA~0.0.1.0'
          Add-WindowsCapability -Online -Name 'Language.TextToSpeech~~~ar-EG~0.0.1.0'

      - name: Restore (locked)
        run: dotnet restore src/Mubsir.App

      - name: Publish win-x64
        run: dotnet publish src/Mubsir.App -c Release -r win-x64 --no-restore -o publish

      - name: Read the books
        shell: pwsh
        run: |
          $p = Start-Process publish/Mubsir.exe -ArgumentList '--book-check', 'tests/fixtures/books', 'book-check.txt' -Wait -PassThru
          Get-Content book-check.txt -Encoding utf8
          exit $p.ExitCode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: book-check
          path: book-check.txt
          if-no-files-found: warn
          retention-days: 14
