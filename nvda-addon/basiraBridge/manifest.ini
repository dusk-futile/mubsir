name = basiraBridge
summary = "Basira Bridge"
description = "Companion add-on for Basira, an AI screen assistant for blind users. It switches NVDA's voice between Arabic and English inside mixed text, so English words in Arabic sentences (and Arabic words in English ones) are read by the right voice. It can also quiet NVDA's focus announcements for a moment while Basira carries out a step on the screen."
