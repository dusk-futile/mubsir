<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mubsir social preview</title>
<!-- Source of social-preview.png (1280x640), the image GitHub shows when the repo link is shared.
     Upload it in the repo's Settings > General > Social preview. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500&display=block">
<style>
  * { box-sizing:border-box; margin:0 }
  body { width:1280px; height:640px; background:#080D3F; color:#FFF4DE; font-family:"Readex Pro",system-ui,sans-serif;
    display:grid; grid-template-columns:auto 1fr; align-items:center; gap:72px; padding:0 110px;
    background-image:radial-gradient(circle at 22% 50%, rgba(46,64,170,.42), transparent 44%) }
  img { width:300px; height:300px }
  h1 { font-size:84px; font-weight:500; line-height:1; letter-spacing:-.015em }
  h1 span { color:#F3C343; margin-inline-start:18px }
  p { margin-top:26px; font-size:30px; font-weight:300; line-height:1.4; opacity:.82; max-width:640px }
  .meta { margin-top:30px; font-size:20px; opacity:.6; letter-spacing:.02em }
</style>
</head>
<body>
  <img src="mubsir-mark.svg" alt="">
  <div>
    <h1>Mubsir<span>مُبصِر</span></h1>
    <p>An AI screen assistant for blind and low&#8209;vision Windows users.</p>
    <div class="meta">Arabic and English · voice and keyboard · works with NVDA</div>
  </div>
</body>
</html>
